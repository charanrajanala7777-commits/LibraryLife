{% extends "base.html" %}
{% block title %}{{ action }} Member – Library Loan Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 fw-semibold fs-5">
        <i class="bi bi-person me-2 text-primary"></i>{{ action }} Member
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ user.name if user else '' }}"
                   placeholder="e.g. Jane Doe" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control"
                   value="{{ user.email if user else '' }}"
                   placeholder="e.g. jane@email.com" required />
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>{{ action }} Member
            </button>
            <a href="{{ url_for('list_users') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
