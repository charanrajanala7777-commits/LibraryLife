<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Library Loan Tracker{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-book-half me-2"></i>Library Life
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navLinks">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navLinks">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'user' in request.endpoint %}active{% endif %}"
             href="{{ url_for('list_users') }}">
            <i class="bi bi-people me-1"></i>Members
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'book' in request.endpoint %}active{% endif %}"
             href="{{ url_for('list_books') }}">
            <i class="bi bi-journal-bookmark me-1"></i>Books
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'loan' in request.endpoint %}active{% endif %}"
             href="{{ url_for('list_loans') }}">
            <i class="bi bi-arrow-left-right me-1"></i>Loans
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Flash messages ── -->
<div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
</div>

<!-- ── Page content ── -->
<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-3 border-top mt-5">
  CS665 Project 3 &mdash; Library Loan Tracker &copy; 2025
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
