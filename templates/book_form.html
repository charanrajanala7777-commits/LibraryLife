{% extends "base.html" %}
{% block title %}{{ action }} Book – Library Loan Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 fw-semibold fs-5">
        <i class="bi bi-journal me-2 text-success"></i>{{ action }} Book
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control"
                   value="{{ book.title if book else '' }}"
                   placeholder="e.g. Clean Code" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
            <input type="text" name="author" class="form-control"
                   value="{{ book.author if book else '' }}"
                   placeholder="e.g. Robert C. Martin" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Genre <span class="text-danger">*</span></label>
            <select name="genre" class="form-select" required>
              {% set genres = ['Technology', 'Science', 'History', 'Fiction', 'Non-Fiction',
                               'Biography', 'Self-Help', 'General'] %}
              {% for g in genres %}
                <option value="{{ g }}"
                  {% if book and book.genre == g %}selected{% endif %}>
                  {{ g }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Published Date</label>
            <input type="date" name="published_date" class="form-control"
                   value="{{ book.published_date if book and book.published_date else '' }}" />
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg me-1"></i>{{ action }} Book
            </button>
            <a href="{{ url_for('list_books') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
